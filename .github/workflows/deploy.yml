name: Deploy to Server

on:
  push:
    branches:
      - new-branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deploy archive
        run: |
          tar -czf deploy.tar.gz \
            app component context hooks lib migrations public types utils \
            package.json package-lock.json \
            next.config.ts tsconfig.json \
            postcss.config.mjs eslint.config.mjs \
            migration.ts || true

      - name: Upload project to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 72.62.198.90
          username: root
          password: ${{ secrets.VM_PASSWORD }}
          source: deploy.tar.gz
          target: /var/www/visionPublication

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 72.62.198.90
          username: root
          password: ${{ secrets.VM_PASSWORD }}
          script: |
            cd /var/www/visionPublication

            # Backup uploaded assets before cleaning
            if [ -d "public/assets" ]; then
              mv public/assets /tmp/visionpub-assets-backup
            fi

            # Remove old source files to ensure a clean extraction
            rm -rf app component context hooks lib migrations public types utils .next

            # Extract the new files
            tar -xzf deploy.tar.gz
            rm -f deploy.tar.gz

            # Restore uploaded assets
            if [ -d "/tmp/visionpub-assets-backup" ]; then
              mkdir -p public/assets
              cp -r /tmp/visionpub-assets-backup/* public/assets/
              rm -rf /tmp/visionpub-assets-backup
            fi

            # Create/Update .env file
            cat <<EOF > .env
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
            RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }}
            NEXT_PUBLIC_RAZORPAY_KEY_ID=${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
            NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET=${{ secrets.NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET }}
            EOF

            # Install dependencies and build
            npm ci
            npm run build

            # Restart the application using PM2
            # Delete old process to avoid stale config/cwd issues
            pm2 delete visionpub || true
            # Start fresh with explicit working directory
            pm2 start npm --name visionpub --cwd /var/www/visionPublication -- start
            pm2 save

name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install & Build
        run: |
          npm ci
          npm run build
          tar -czf build.tar.gz .next public package.json package-lock.json

      - name: Upload build to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 72.62.198.90
          username: root
          password: ${{ secrets.VM_PASSWORD }}
          source: build.tar.gz
          target: /var/www/visionPublication

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 72.62.198.90
          username: root
          password: ${{ secrets.VM_PASSWORD }}
          script: |
            cd /var/www/visionPublication

            # Extract build
            tar -xzf build.tar.gz
            rm -f build.tar.gz

            # Create .env
            cat <<EOF > .env
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
            NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET=${{ secrets.NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
            RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }}
            NEXT_PUBLIC_RAZORPAY_KEY_ID=${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
            EOF

            # Install prod deps only
            npm ci --omit=dev

            # Start / Restart app
            pm2 restart visionpub || pm2 start npm --name visionpub -- start
            pm2 save

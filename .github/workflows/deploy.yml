name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deploy archive
        run: |
          tar -czf deploy.tar.gz \
            app pages public \
            package.json package-lock.json \
            next.config.js \
            prisma \
            .npmrc || true

      - name: Upload project to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 72.62.198.90
          username: root
          password: ${{ secrets.VM_PASSWORD }}
          source: deploy.tar.gz
          target: /var/www/visionPublication

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 72.62.198.90
          username: root
          password: ${{ secrets.VM_PASSWORD }}
          script: |
            cd /var/www/visionPublication

            rm -rf app pages public node_modules .next
            tar -xzf deploy.tar.gz
            rm -f deploy.tar.gz

            cat <<EOF > .env
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
            RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }}
            NEXT_PUBLIC_RAZORPAY_KEY_ID=${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
            NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET=${{ secrets.NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET }}
            EOF

            npm ci
            npm run build

            pm2 restart visionpub || pm2 start npm --name visionpub -- start
            pm2 save
